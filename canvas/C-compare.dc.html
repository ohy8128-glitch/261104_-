<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>C 비교형</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
body{margin:0}
a{color:#FFC94D}a:hover{color:#FFE08F}
</style>
</helmet>
<div style="width: 360px; height: 920px; overflow: hidden; background: #FFFFFF; font-family: 'Noto Sans KR', sans-serif">
<div style="height: 700px; box-sizing: border-box; background: #0E1016; color: #FFFFFF; font-variant-numeric: tabular-nums; padding: 32px 20px 0; display: flex; flex-direction: column; gap: 18px">
  <span style="align-self: flex-start; font-size: 13px; font-weight: 700; color: #111111; background: #FFC94D; padding: 6px 12px; border-radius: 999px">관리비도 카드 실적으로 인정</span>
  <h1 style="margin: 0; font-size: 24px; line-height: 1.4; font-weight: 800; letter-spacing: -0.5px">관리비가 실적에 들어가면<br>할인이 훨씬 가까워요</h1>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #C9CED9; background: #1A1D26; border-radius: 12px; padding: 12px 16px">
      <span>관리비 <strong style="color: #FFFFFF">{{feeStr}}원</strong> 기준</span>
      <span>목표 <strong style="color: #FFFFFF">{{goal}}</strong></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: #1A1D26; border: 1px solid #2A2E3A; border-radius: 16px; padding: 18px 14px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; color: #A9AFBD">관리비 실적 제외 카드</span>
        <span style="font-size: 12px; color: #A9AFBD">따로 써야 하는 금액</span>
        <strong style="font-size: 22px; color: #A9AFBD; letter-spacing: -0.5px">{{otherStr}}원</strong>
      </div>
      <div style="background: #1A1D26; border: 2px solid #FFC94D; border-radius: 16px; padding: 17px 13px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; color: #FFC94D; font-weight: 700">이 카드</span>
        <span style="font-size: 12px; color: #C9CED9">따로 써야 하는 금액</span>
        <strong style="font-size: 22px; color: #FFFFFF; letter-spacing: -0.5px">{{mineStr}}원</strong>
      </div>
    </div>
    <div style="background: #FFC94D; color: #111111; border-radius: 14px; padding: 16px; font-size: 17px; font-weight: 800; line-height: 1.45; text-align: center">{{punch}}</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; color: #A9AFBD">다른 관리비로 계산해보기</span>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="margin-top: auto; height: 110px; box-sizing: border-box; padding: 15px 0 39px; display: flex; flex-direction: column">
    <button type="button" style="height: 56px; border: 0; border-radius: 28px; background: #FFFFFF; color: #111111; font: 700 17px/1 'Noto Sans KR', sans-serif; cursor: pointer">카드 혜택 보기</button>
  </div>
</div>
<div style="padding: 40px 20px; color: #111111; display: flex; flex-direction: column; gap: 12px">
  <span style="align-self: flex-start; font-size: 13px; font-weight: 700; color: #FFFFFF; background: #3F63E8; padding: 4px 10px; border-radius: 999px">Event</span>
  <h2 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.5px">최대 15만원 캐시백</h2>
  <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #333333">아파트관리비 자동납부 신청하고<br>15만원 이상 이용 시</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":920}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { fee: 266880 }; }
  renderVals() {
    const f = this.state.fee;
    const fmt = (n) => Math.round(n).toLocaleString('ko-KR');
    const s = f >= 1000000 ? 2 : (f >= 500000 ? 1 : 0);
    const target = s === 2 ? 1000000 : 500000;
    const mine = Math.max(0, target - f);
    const on = "height:36px;padding:0 14px;border-radius:999px;border:1px solid #FFC94D;background:#FFC94D;color:#111111;font:700 13px/1 'Noto Sans KR',sans-serif;cursor:pointer";
    const off = "height:36px;padding:0 14px;border-radius:999px;border:1px solid #3A3F4D;background:transparent;color:#FFFFFF;font:500 13px/1 'Noto Sans KR',sans-serif;cursor:pointer";
    const chips = [266880, 520000, 1030000].map((v) => ({
      label: fmt(v) + '원', pressed: String(v === f), style: v === f ? on : off,
      pick: () => this.setState({ fee: v })
    }));
    const disc = s === 2 ? '월 10,000원' : '월 6,000원';
    return {
      feeStr: fmt(f),
      goal: disc + ' 할인',
      otherStr: fmt(target),
      mineStr: fmt(mine),
      punch: mine > 0 ? fmt(mine) + '원만 더 쓰면 ' + disc + ' 할인' : '관리비만 내도 ' + disc + ' 할인',
      chips
    };
  }
}
</script>
</body>
</html>

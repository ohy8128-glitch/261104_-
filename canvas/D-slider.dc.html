<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>D 슬라이더 계산기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
body{margin:0}
a{color:#FFC94D}a:hover{color:#FFE08F}
</style>
</helmet>
<div style="width: 360px; height: 920px; overflow: hidden; background: #FFFFFF; font-family: 'Noto Sans KR', sans-serif">
<div style="height: 700px; box-sizing: border-box; background: #0E1016; color: #FFFFFF; font-variant-numeric: tabular-nums; padding: 32px 20px 0; display: flex; flex-direction: column; gap: 18px">
  <span style="align-self: flex-start; font-size: 13px; font-weight: 700; color: #111111; background: #FFC94D; padding: 6px 12px; border-radius: 999px">관리비도 카드 실적으로 인정</span>
  <h1 style="margin: 0; font-size: 24px; line-height: 1.4; font-weight: 800; letter-spacing: -0.5px">우리 집 관리비로<br>얼마나 할인될까요?</h1>

  <div style="background: #1A1D26; border: 1px solid #2A2E3A; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
    <label for="fee" style="font-size: 13px; color: #A9AFBD">11월 관리비</label>
    <div style="font-size: 30px; font-weight: 800; letter-spacing: -0.5px">{{feeStr}}<span style="font-size: 18px; font-weight: 500; margin-left: 2px">원</span></div>
    <input id="fee" type="range" min="0" max="1200000" step="10" value="{{fee}}" onChange="{{onSlide}}" style="width: 100%; height: 28px; margin: 0; accent-color: #FFC94D; cursor: pointer">

    <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 4px">
      <sc-for list="{{steps}}" as="t" hint-placeholder-count="2">
        <div style="{{t.box}}">
          <span style="display: flex; flex-direction: column; gap: 2px">
            <strong style="font-size: 15px">{{t.disc}}</strong>
            <span style="font-size: 12px; color: #A9AFBD">{{t.tier}}</span>
          </span>
          <span style="{{t.stStyle}}">{{t.status}}</span>
        </div>
      </sc-for>
    </div>
    <div style="background: #0E1016; border-radius: 12px; padding: 14px 16px; font-size: 17px; font-weight: 700; line-height: 1.45"><span style="color: #FFC94D">{{resLead}}</span> {{resTail}}</div>
  </div>

  <div style="margin-top: auto; height: 110px; box-sizing: border-box; padding: 15px 0 39px; display: flex; flex-direction: column">
    <button type="button" style="height: 56px; border: 0; border-radius: 28px; background: #FFFFFF; color: #111111; font: 700 17px/1 'Noto Sans KR', sans-serif; cursor: pointer">카드 혜택 보기</button>
  </div>
</div>
<div style="padding: 40px 20px; color: #111111; display: flex; flex-direction: column; gap: 12px">
  <span style="align-self: flex-start; font-size: 13px; font-weight: 700; color: #FFFFFF; background: #3F63E8; padding: 4px 10px; border-radius: 999px">Event</span>
  <h2 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.5px">최대 15만원 캐시백</h2>
  <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #333333">아파트관리비 자동납부 신청하고<br>15만원 이상 이용 시</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":920}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { fee: 266880 }; }
  renderVals() {
    const f = this.state.fee;
    const fmt = (n) => Math.round(n).toLocaleString('ko-KR');
    const s = f >= 1000000 ? 2 : (f >= 500000 ? 1 : 0);
    const r5 = Math.max(0, 500000 - f), r10 = Math.max(0, 1000000 - f);
    const boxOn = 'display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid #FFC94D;background:#26231A';
    const boxOff = 'display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid #2A2E3A;background:transparent';
    const stOn = 'font-size:13px;font-weight:700;color:#111111;background:#FFC94D;padding:6px 10px;border-radius:999px';
    const stOff = 'font-size:13px;font-weight:500;color:#C9CED9';
    const steps = [
      { disc: '월 6,000원 할인', tier: '실적 50만 원 이상', left: r5 },
      { disc: '월 10,000원 할인', tier: '실적 100만 원 이상', left: r10 }
    ].map((t) => ({
      disc: t.disc, tier: t.tier,
      status: t.left === 0 ? '관리비로 달성' : fmt(t.left) + '원 더',
      box: t.left === 0 ? boxOn : boxOff,
      stStyle: t.left === 0 ? stOn : stOff
    }));
    const R = [
      [fmt(r5) + '원만 더 쓰면', '월 6,000원 할인'],
      ['추가 결제 없이', '월 6,000원 할인'],
      ['추가 결제 없이', '월 10,000원 할인 (최대)']
    ][s];
    return {
      fee: f, feeStr: fmt(f),
      onSlide: (e) => this.setState({ fee: Number(e.target.value) }),
      steps, resLead: R[0], resTail: R[1]
    };
  }
}
</script>
</body>
</html>

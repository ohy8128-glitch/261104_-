<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>A 게이지형</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
body{margin:0}
a{color:#FFC94D}a:hover{color:#FFE08F}
</style>
</helmet>
<div style="width: 360px; height: 920px; overflow: hidden; background: #FFFFFF; font-family: 'Noto Sans KR', sans-serif">
<div style="height: 700px; box-sizing: border-box; background: #0E1016; color: #FFFFFF; font-variant-numeric: tabular-nums; padding: 32px 20px 0; display: flex; flex-direction: column; gap: 18px">
  <span style="align-self: flex-start; font-size: 13px; font-weight: 700; color: #111111; background: #FFC94D; padding: 6px 12px; border-radius: 999px">관리비도 카드 실적으로 인정</span>
  <h1 style="margin: 0; font-size: 24px; line-height: 1.4; font-weight: 800; letter-spacing: -0.5px">{{h1a}}<br>{{h1pre}}<span style="color: #FFC94D">{{h1hl}}</span>{{h1post}}</h1>

  <div style="background: #1A1D26; border: 1px solid #2A2E3A; border-radius: 20px; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="position: relative; height: 18px; background: #2A2E3A; border-radius: 9px; overflow: hidden">
      <div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{feeW}}; background: #FFC94D"></div>
      <div style="position: absolute; left: {{feeW}}; top: 0; bottom: 0; width: {{gapW}}; background: repeating-linear-gradient(135deg, #5A5F70 0 4px, #2A2E3A 4px 8px)"></div>
      <div style="position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: #0E1016"></div>
    </div>
    <div style="position: relative; height: 38px; font-size: 12px; line-height: 1.5; color: #A9AFBD">
      <div style="position: absolute; left: 50%; top: 0; transform: translateX(-50%); text-align: center">50만<br><strong style="color: #FFFFFF">월 6,000원</strong></div>
      <div style="position: absolute; right: 0; top: 0; text-align: right">100만<br><strong style="color: #FFFFFF">월 10,000원</strong></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #C9CED9; padding-top: 4px; border-top: 1px solid #2A2E3A">
      <div style="display: flex; justify-content: space-between; padding-top: 12px"><span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #FFC94D"></span>관리비 (자동 반영)</span><span style="color: #FFFFFF; font-weight: 700">{{feeStr}}원</span></div>
      <sc-if value="{{showGap}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; justify-content: space-between"><span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 3px; background: repeating-linear-gradient(135deg, #5A5F70 0 2px, #2A2E3A 2px 4px)"></span>{{gapLabel}}</span><span style="color: #FFFFFF; font-weight: 700">{{gapStr}}원</span></div>
      </sc-if>
    </div>
    <div style="background: #0E1016; border-radius: 12px; padding: 14px 16px; font-size: 17px; font-weight: 700; line-height: 1.45"><span style="color: #FFC94D">{{resLead}}</span> {{resTail}}</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; color: #A9AFBD">다른 관리비로 계산해보기</span>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="margin-top: auto; height: 110px; box-sizing: border-box; padding: 15px 0 39px; display: flex; flex-direction: column">
    <button type="button" style="height: 56px; border: 0; border-radius: 28px; background: #FFFFFF; color: #111111; font: 700 17px/1 'Noto Sans KR', sans-serif; cursor: pointer">카드 혜택 보기</button>
  </div>
</div>
<div style="padding: 40px 20px; color: #111111; display: flex; flex-direction: column; gap: 12px">
  <span style="align-self: flex-start; font-size: 13px; font-weight: 700; color: #FFFFFF; background: #3F63E8; padding: 4px 10px; border-radius: 999px">Event</span>
  <h2 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.5px">최대 15만원 캐시백</h2>
  <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #333333">아파트관리비 자동납부 신청하고<br>15만원 이상 이용 시</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":920}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { fee: 266880 }; }
  renderVals() {
    const f = this.state.fee;
    const fmt = (n) => Math.round(n).toLocaleString('ko-KR');
    const s = f >= 1000000 ? 2 : (f >= 500000 ? 1 : 0);
    const r5 = Math.max(0, 500000 - f), r10 = Math.max(0, 1000000 - f);
    const pct = Math.min(100, Math.round(f / 5000));
    const on = "height:36px;padding:0 14px;border-radius:999px;border:1px solid #FFC94D;background:#FFC94D;color:#111111;font:700 13px/1 'Noto Sans KR',sans-serif;cursor:pointer";
    const off = "height:36px;padding:0 14px;border-radius:999px;border:1px solid #3A3F4D;background:transparent;color:#FFFFFF;font:500 13px/1 'Noto Sans KR',sans-serif;cursor:pointer";
    const chips = [266880, 520000, 1030000].map((v) => ({
      label: fmt(v) + '원', pressed: String(v === f), style: v === f ? on : off,
      pick: () => this.setState({ fee: v })
    }));
    const H = [
      ['11월 관리비 ' + fmt(f) + '원으로', '실적 50만 원의 ', pct + '%', '를 채웠어요'],
      ['관리비만으로', '실적 ', '50만 원', ' 달성했어요'],
      ['관리비만으로', '실적 ', '100만 원', ' 달성했어요']
    ][s];
    const R = [
      [fmt(r5) + '원만 더 쓰면', '월 6,000원 할인'],
      ['추가 결제 없이', '월 6,000원 할인'],
      ['추가 결제 없이', '월 10,000원 할인 (최대)']
    ][s];
    return {
      h1a: H[0], h1pre: H[1], h1hl: H[2], h1post: H[3],
      feeStr: fmt(f),
      feeW: Math.min(100, f / 10000) + '%',
      gapW: (s === 0 ? r5 : s === 1 ? r10 : 0) / 10000 + '%',
      showGap: s < 2,
      gapLabel: s === 0 ? '50만까지 남은 금액' : '100만까지 남은 금액',
      gapStr: fmt(s === 0 ? r5 : r10),
      resLead: R[0], resTail: R[1],
      chips
    };
  }
}
</script>
</body>
</html>
